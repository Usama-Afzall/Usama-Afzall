<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" width="1280" height="380" role="img" aria-label="Usama Afzal - Shopify Developer, Ecommerce Specialist, AI Automation Builder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b0d"/>
      <stop offset="1" stop-color="#17171c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#f5c518" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#f5c518" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd84a"/>
      <stop offset="1" stop-color="#f5a800"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="380" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="380" rx="18" fill="url(#grid)"/>
  <rect width="1280" height="380" rx="18" fill="url(#glow)"/>
  <rect x="0" y="0" width="8" height="380" fill="url(#gold)"/>

  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="72" y="84" fill="#f5c518" font-size="17" font-weight="700" letter-spacing="4">WEBSITE PRISM  /  FOUNDER</text>
    <text x="70" y="168" fill="#ffffff" font-size="84" font-weight="800" letter-spacing="-2">Usama Afzal</text>
    <text x="72" y="216" fill="#d6d6dc" font-size="27" font-weight="500">Shopify Developer  ·  Ecommerce Specialist  ·  AI Automation Builder</text>

    <!-- stat chips -->
    <g font-weight="700">
      <rect x="72" y="262" width="236" height="68" rx="12" fill="#ffffff" fill-opacity="0.06" stroke="#f5c518" stroke-opacity="0.45"/>
      <text x="92" y="292" fill="#f5c518" font-size="25">900+</text>
      <text x="92" y="316" fill="#b9b9c2" font-size="14" font-weight="500">projects delivered</text>

      <rect x="326" y="262" width="236" height="68" rx="12" fill="#ffffff" fill-opacity="0.06" stroke="#f5c518" stroke-opacity="0.45"/>
      <text x="346" y="292" fill="#f5c518" font-size="25">550+</text>
      <text x="346" y="316" fill="#b9b9c2" font-size="14" font-weight="500">Shopify stores</text>

      <rect x="580" y="262" width="236" height="68" rx="12" fill="#ffffff" fill-opacity="0.06" stroke="#f5c518" stroke-opacity="0.45"/>
      <text x="600" y="292" fill="#f5c518" font-size="25">4.8 / 5</text>
      <text x="600" y="316" fill="#b9b9c2" font-size="14" font-weight="500">480+ Fiverr reviews</text>

      <rect x="834" y="262" width="236" height="68" rx="12" fill="#ffffff" fill-opacity="0.06" stroke="#f5c518" stroke-opacity="0.45"/>
      <text x="854" y="292" fill="#f5c518" font-size="25">8+ years</text>
      <text x="854" y="316" fill="#b9b9c2" font-size="14" font-weight="500">building for the web</text>
    </g>

    <!-- badge -->
    <rect x="1010" y="58" width="198" height="40" rx="20" fill="url(#gold)"/>
    <text x="1109" y="84" fill="#111111" font-size="16" font-weight="800" text-anchor="middle" letter-spacing="1">FIVERR VETTED PRO</text>
    <text x="1208" y="130" fill="#b9b9c2" font-size="15" font-weight="500" text-anchor="end">Shopify Partner</text>
    <text x="1208" y="154" fill="#b9b9c2" font-size="15" font-weight="500" text-anchor="end">usama.websiteprism.com</text>
  </g>
</svg>
