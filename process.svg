<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 250" width="1280" height="250" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif"><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0b0d"/><stop offset="1" stop-color="#17171d"/></linearGradient>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffd84a"/><stop offset="1" stop-color="#f5a800"/></linearGradient>
<radialGradient id="glow" cx="0.82" cy="0.18" r="0.65"><stop offset="0" stop-color="#f5c518" stop-opacity="0.26"/><stop offset="1" stop-color="#f5c518" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity="0.035"/></pattern>
</defs><rect x="0" y="0" width="1280" height="250" rx="16" fill="#131318" stroke="#2a2a33" stroke-width="1"/><line x1="128.0" y1="64" x2="1152.0" y2="64" stroke="#f5c518" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="6 6"/><circle cx="128.0" cy="64" r="26" fill="#0b0b0d" stroke="#f5c518" stroke-width="2"/><text x="128.0" y="73" font-size="24" fill="#f5c518" font-weight="800" text-anchor="middle">1</text><text x="128.0" y="124" font-size="21" fill="#ffffff" font-weight="700" text-anchor="middle">Brief</text><text x="128.0" y="152" font-size="13.5" fill="#b9b9c4" font-weight="400" text-anchor="middle">You share the goal; I ask</text><text x="128.0" y="172" font-size="13.5" fill="#b9b9c4" font-weight="400" text-anchor="middle">only the questions that</text><text x="128.0" y="192" font-size="13.5" fill="#b9b9c4" font-weight="400" text-anchor="middle">matter.</text><circle cx="384.0" cy="64" r="26" fill="#0b0b0d" stroke="#f5c518" stroke-width="2"/><text x="384.0" y="73" font-size="24" fill="#f5c518" font-weight="800" text-anchor="middle">2</text><text x="384.0" y="124" font-size="21" fill="#ffffff" font-weight="700" text-anchor="middle">Scope</text><text x="384.0" y="152" font-size="13.5" fill="#b9b9c4" font-weight="400" text-anchor="middle">Fixed price for defined</text><text x="384.0" y="172" font-size="13.5" fill="#b9b9c4" font-weight="400" text-anchor="middle">projects, hourly for</text><text x="384.0" y="192" font-size="13.5" fill="#b9b9c4" font-weight="400" text-anchor="middle">ongoing work.</text><circle cx="640.0" cy="64" r="26" fill="#0b0b0d" stroke="#f5c518" stroke-width="2"/><text x="640.0" y="73" font-size="24" fill="#f5c518" font-weight="800" text-anchor="middle">3</text><text x="640.0" y="124" font-size="21" fill="#ffffff" font-weight="700" text-anchor="middle">Build</text><text x="640.0" y="152" font-size="13.5" fill="#b9b9c4" font-weight="400" text-anchor="middle">Progress on a preview link,</text><text x="640.0" y="172" font-size="13.5" fill="#b9b9c4" font-weight="400" text-anchor="middle">not a surprise at the end.</text><circle cx="896.0" cy="64" r="26" fill="#0b0b0d" stroke="#f5c518" stroke-width="2"/><text x="896.0" y="73" font-size="24" fill="#f5c518" font-weight="800" text-anchor="middle">4</text><text x="896.0" y="124" font-size="21" fill="#ffffff" font-weight="700" text-anchor="middle">Launch</text><text x="896.0" y="152" font-size="13.5" fill="#b9b9c4" font-weight="400" text-anchor="middle">Tested on mobile and</text><text x="896.0" y="172" font-size="13.5" fill="#b9b9c4" font-weight="400" text-anchor="middle">desktop, with a walkthrough</text><text x="896.0" y="192" font-size="13.5" fill="#b9b9c4" font-weight="400" text-anchor="middle">for you.</text><circle cx="1152.0" cy="64" r="26" fill="#0b0b0d" stroke="#f5c518" stroke-width="2"/><text x="1152.0" y="73" font-size="24" fill="#f5c518" font-weight="800" text-anchor="middle">5</text><text x="1152.0" y="124" font-size="21" fill="#ffffff" font-weight="700" text-anchor="middle">Support</text><text x="1152.0" y="152" font-size="13.5" fill="#b9b9c4" font-weight="400" text-anchor="middle">Still available after</text><text x="1152.0" y="172" font-size="13.5" fill="#b9b9c4" font-weight="400" text-anchor="middle">delivery. Many clients come</text><text x="1152.0" y="192" font-size="13.5" fill="#b9b9c4" font-weight="400" text-anchor="middle">back.</text></svg>